server:
  address: ":8080"
  # Bearer token required to access /status and /status/{id}. These
  # endpoints expose job details (repository names, branches, commit
  # hashes, error messages), so set this for any deployment reachable
  # outside a trusted network. If empty, the endpoints are unauthenticated
  # and a warning is logged at startup.
  statusToken: ""
  # Path to a JSON-lines audit log recording security-relevant events
  # (webhook signature verification, replay detection, status endpoint
  # access, key rotation detection). If empty, audit events are written to
  # stderr instead.
  auditLogPath: ""

forgejo:
  url: "https://forge.example.com"
  token: ""
  # Deprecated: use webhookSecrets instead, which supports rotation. If
  # set, it is treated as an additional valid secret alongside
  # webhookSecrets.
  webhookSecret: ""
  # Ordered list of currently-valid webhook secrets. To rotate without
  # downtime: add the new secret here, update Forgejo's webhook
  # configuration to sign with it, then remove the old secret once
  # deliveries signed with it have stopped arriving, e.g.:
  #   webhookSecrets:
  #     - "new-secret"
  #     - "old-secret"
  webhookSecrets: []

github:
  # Default destination owner/org for mirrored repositories. Used for any
  # Forgejo owner that has no entry in ownerMap. If both owner and ownerMap
  # are empty, each repository is mirrored under its own Forgejo owner's
  # name on GitHub.
  owner: "backup"
  # Optional per-Forgejo-owner overrides, so different Forgejo users or
  # organizations can be routed to different GitHub destinations from a
  # single installation, e.g.:
  #   ownerMap:
  #     alice: "backup"
  #     bob: "backup"
  #     team: "backup-org"
  ownerMap: {}
  # Builds the destination repository name from the source owner/repo.
  # Supports "{owner}" and "{repo}" placeholders. Defaults to "{repo}"
  # (name unchanged) if omitted. With owner: "backup" and
  # repoNameFormat: "{owner}-{repo}", a single installation maps:
  #   alice/app  -> backup/alice-app
  #   bob/game   -> backup/bob-game
  #   team/docs  -> backup/team-docs
  repoNameFormat: "{owner}-{repo}"
  token: ""
  autoCreate: true
  # Visibility of repositories created via autoCreate. Defaults to true
  # (private) if omitted, since these repositories hold encrypted backups.
  private: true

encryption:
  # An age X25519 recipient public key (e.g. "age1..."), a newline-separated
  # list of recipients, or a path to a file containing one recipient per
  # line. Generate a keypair with: go run filippo.io/age/cmd/age-keygen@latest
  recipient: ""

git:
  cacheDir: "cache"