name: PR Labels

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR from Type of change checkboxes
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const checked = (text) => new RegExp(`\\[x\\]\\s*${text}`, 'i').test(body);

            const labels = [];
            if (checked('Feature')) labels.push('feature');
            if (checked('Bug fix')) labels.push('fix');
            if (checked('Refactor')) labels.push('refactor');
            if (checked('Documentation')) labels.push('documentation');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
              });
            }
