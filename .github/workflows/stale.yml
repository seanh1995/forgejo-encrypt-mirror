name: Stale

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no
            activity in 60 days. It will be closed in 14 days if no further activity occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has had no
            activity in 60 days. It will be closed in 14 days if no further activity occurs.
