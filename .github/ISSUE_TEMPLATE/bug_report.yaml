name: Bug report
description: Report a problem with forgejo-encrypt-mirror
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From the startup log or the `forgejo_mirror_build_info` metric.
      placeholder: v1.2.3
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/arch, and whether you're running via Docker (include the platform, e.g. linux/arm64).
      placeholder: Docker on linux/amd64
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Paste the relevant parts of your config, with tokens/keys/secrets redacted.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant structured log output, with tokens/secrets redacted.
      render: shell
